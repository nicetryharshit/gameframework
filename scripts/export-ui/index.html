<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="export-token" content="__EXPORT_TOKEN__">
  <title>Workshop</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <div class="app">
    <aside id="side" aria-label="Navigation"></aside>
    <main id="main">
      <div id="view" class="wrap"></div>
    </main>
  </div>
  <div id="toasts" class="toasts" aria-live="polite"></div>
  <footer class="jobbar" id="jobbar" aria-live="polite"></footer>

  <dialog id="game-dialog" aria-labelledby="game-title">
    <form id="game-form" class="dialog-form">
      <h2 id="game-title">Game details</h2>
      <label>Game name<input name="name" required maxlength="80"></label>
      <label>Version<input name="version" required placeholder="1.0.0"></label>
      <label>Identifier<input name="identifier" required placeholder="com.yourstudio.game"></label>
      <p class="hint">Apple and Android use the identifier to tell apps apart.</p>
      <p class="hint error" id="game-error" hidden></p>
      <div class="row-actions">
        <button type="submit" class="btn primary">Save</button>
        <button type="button" class="btn" id="cancel-game">Cancel</button>
      </div>
    </form>
  </dialog>
  <dialog id="update-dialog" class="wide" aria-labelledby="update-title">
    <form id="update-form" class="dialog-form">
      <div class="dialog-body">
        <h2 id="update-title">Update tools</h2>
        <p class="hint" id="update-sub"></p>
        <div id="update-list" class="pick-list"></div>
        <h3 class="subhead">Renderers</h3>
        <div id="renderer-list" class="pick-list"></div>
        <h3 class="subhead">Physics engines</h3>
        <div id="physics-list" class="pick-list"></div>
        <p class="hint">Only the framework tools in <span class="mono">tools/gameframework</span> change. Your game code, <span class="mono">src-tauri</span>, profiles and builds are never touched.</p>
        <p class="hint error" id="update-error" hidden></p>
      </div>
      <div class="dialog-foot">
        <button type="submit" class="btn primary">Update selected</button>
        <button type="button" class="btn" id="cancel-update">Cancel</button>
      </div>
    </form>
  </dialog>
  <script type="module" src="/app.js"></script>
</body>
</html>
